{% if categories %}
<div class="accordion accordion-flush product-assortment">
    {% for category in categories %}
    <div class="accordion-item">
        <h2 class="accordion-header">
            <button class="accordion-button{% if not expanded %} collapsed{% endif %} fw-bold text-uppercase" type="button" data-bs-toggle="collapse" data-bs-target="#assortment-{{ uuid }}-{{ category.key }}" aria-expanded="{{ expanded|yesno:"true,false" }}" aria-controls="assortment-{{ uuid }}-{{ category.key }}">
                {{ category.name }} <span class="badge bg-secondary ms-2">{{ category.products|length }}</span>
            </button>
        </h2>
        <div id="assortment-{{ uuid }}-{{ category.key }}" class="accordion-collapse collapse{% if expanded %} show{% endif %}">
            <div class="accordion-body">
                <div class="row g-4">
                    {% for product in category.products %}
                        <div class="col-12 col-md-6 col-lg-4">
                            {% include "shop/includes/product_card_overview.html" %}
                        </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}
