{% load i18n %}
<div class="production-day-switch btn-group d-print-none" role="group">
  {% if day_switch.previous_url %}
  <a class="btn btn-surface" href="{{ day_switch.previous_url }}" aria-label="{% trans 'Previous production day' %}"{% if day_switch.target %}
    hx-get="{{ day_switch.previous_url }}" hx-target="{{ day_switch.target }}" hx-select="{{ day_switch.target }}" hx-swap="outerHTML" hx-push-url="true"{% endif %}><i class="fas fa-chevron-left"></i></a>
  {% else %}
  <span class="btn btn-surface disabled" aria-hidden="true"><i class="fas fa-chevron-left"></i></span>
  {% endif %}
  <div class="btn-group" role="group">
    <button type="button" class="btn btn-surface day-picker-toggle" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
      <i class="fas fa-calendar-days" aria-hidden="true"></i>
      <span>{{ day_switch.production_day.day_of_sale|date:"D, j. M Y" }}</span>
      <i class="fas fa-angle-down" aria-hidden="true"></i>
    </button>
    <div class="dropdown-menu day-picker-menu">
      {% include "workshop/includes/production_day_calendar.html" with calendar=day_switch.calendar %}
    </div>
  </div>
  {% if day_switch.next_url %}
  <a class="btn btn-surface" href="{{ day_switch.next_url }}" aria-label="{% trans 'Next production day' %}"{% if day_switch.target %}
    hx-get="{{ day_switch.next_url }}" hx-target="{{ day_switch.target }}" hx-select="{{ day_switch.target }}" hx-swap="outerHTML" hx-push-url="true"{% endif %}><i class="fas fa-chevron-right"></i></a>
  {% else %}
  <span class="btn btn-surface disabled" aria-hidden="true"><i class="fas fa-chevron-right"></i></span>
  {% endif %}
</div>
