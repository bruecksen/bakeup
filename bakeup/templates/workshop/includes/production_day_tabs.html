<ul class="nav nav-tabs day-tabs d-print-none"{% if day_switch.tabs.0.is_pane %} role="tablist"{% endif %}>
  {% for tab in day_switch.tabs %}
  <li class="nav-item"{% if tab.is_pane %} role="presentation"{% endif %}>
    {% if tab.is_pane %}
    <button class="nav-link{% if tab.is_active %} active{% endif %}" id="{{ tab.key }}-tab" data-bs-toggle="tab" data-bs-target="#{{ tab.key }}" type="button" role="tab" aria-controls="{{ tab.key }}" aria-selected="{% if tab.is_active %}true{% else %}false{% endif %}">{{ tab.label }}{% if tab.badge is not None %} <span class="badge rounded-pill text-bg-light">{{ tab.badge }}</span>{% endif %}</button>
    {% else %}
    <a class="nav-link{% if tab.is_active %} active{% endif %}" href="{{ tab.url }}"{% if tab.is_active %} aria-current="true"{% endif %}>{{ tab.label }}{% if tab.badge is not None %} <span class="badge rounded-pill text-bg-light">{{ tab.badge }}</span>{% endif %}</a>
    {% endif %}
  </li>
  {% endfor %}
</ul>
