{% load i18n %}
<div class="modal fade day-calendar-modal d-print-none" id="day-calendar-modal" tabindex="-1" aria-labelledby="day-calendar-modal-title" aria-hidden="true">
  <div class="modal-dialog modal-fullscreen modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="day-calendar-modal-title">{% trans "Calendar" %}</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% trans 'Close' %}"></button>
      </div>
      <div class="modal-body" id="day-calendar-modal-body"></div>
    </div>
  </div>
</div>
