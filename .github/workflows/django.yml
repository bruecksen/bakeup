name: Django CI

on:
  push:
    branches: [ "main", "staging" ]
    # A release tag, e.g. v.0.9.0: only the fetch-tags job runs for it.
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "staging" ]

jobs:
  check:
    name: "Lint, format & migration checks"
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Missing migrations check
        run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings.test

  build:
    needs: check
    # Only deploy on push to main/staging — never on pull requests (checks still run for PRs).
    if: github.event_name == 'push' && github.ref_type == 'branch'
    environment: ${{ github.ref_name }}
    name: "Deploy to ${{ github.ref_name }}"
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/server.key
          chmod 600 ~/.ssh/server.key
          cat >>~/.ssh/config <<END
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/server.key
            StrictHostKeyChecking no
          END
      - name: Deploy to Server
        env:
          ROOT_DIR: ${{ vars.ROOT_DIR }}
          ENV_DIR: ${{ vars.ENV_DIR }}
          BRANCH: ${{ github.ref_name }}
          APP_NAME: ${{ vars.APP_NAME }}
          # Per-environment restart command (Settings > Environments > [main|staging] > Variables).
          # e.g. staging: "supervisorctl restart bakeup-staging" / production: "sudo systemctl restart bakeup"
          RESTART_CMD: ${{ vars.RESTART_CMD }}
        run: |
          ssh server "
            cd $ROOT_DIR &&
            git pull origin $BRANCH &&
            git fetch --tags origin &&
            export PATH=\"\$HOME/.local/bin:\$PATH\" &&
            command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh &&
            uv sync --frozen --no-dev &&
            uv run python manage.py migrate --settings=config.settings.production &&
            uv run python manage.py collectstatic --noinput --settings=config.settings.production &&
            $RESTART_CMD &&
            uv run python manage.py all_tenants_command create_block_reference_page --settings=config.settings.production
          "

  fetch-tags:
    # The app shows its version with `git describe --tags`. A release tag is
    # usually created after the merge was deployed, so the server gets it here.
    # No restart: the version is read on every page.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    environment: main
    name: "Fetch release tag on main"
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/server.key
          chmod 600 ~/.ssh/server.key
          cat >>~/.ssh/config <<END
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/server.key
            StrictHostKeyChecking no
          END
      - name: Fetch tags on server
        env:
          ROOT_DIR: ${{ vars.ROOT_DIR }}
        run: |
          ssh server "
            cd $ROOT_DIR &&
            git fetch --tags origin
          "
