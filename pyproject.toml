[project]
name = "bakeup"
version = "0.1.0"
description = "Best baking app ever!"
requires-python = "==3.12.*"
dependencies = [
    "Pillow>=11.0",  # https://github.com/python-pillow/Pillow
    "argon2-cffi==23.1.0",  # https://github.com/hynek/argon2_cffi
    "whitenoise>=6.9",  # https://github.com/evansd/whitenoise
    # Django
    "django>=5.2,<5.3",  # https://www.djangoproject.com/
    "django-environ>=0.13",  # https://github.com/joke2k/django-environ
    "django-allauth==0.61.1",  # https://github.com/pennersr/django-allauth  # upgrade tracked in ALLAUTH_UPGRADE_PLAN.md
    "django-crispy-forms>=2.4",  # https://github.com/django-crispy-forms/django-crispy-forms
    "crispy-bootstrap5>=2025.4",  # https://github.com/django-crispy-forms/crispy-bootstrap5
    "django-tables2>=2.8",
    "django-treebeard>=4.7.1,<5.0",  # wagtail 7.0 caps <5.0; 4.7.x is validated against Django 5.2 by wagtail
    "sorl-thumbnail>=13.1",
    "django_bootstrap5>=25.2",
    "django_filter>=25.1",
    "django-tenants>=3.14",
    "qrcode==7.4.2",
    "django-taggit==6.1.0",  # no released 5.2 classifier yet; works in practice
    "django-persistent-filters>=1.2",
    "django-htmx>=1.22",
    "wagtail>=7.0,<7.1",  # LTS
    "tablib==3.5.0",
    "wagtailmenus>=4.1",
    "wagtail-non-admin-draftail>=0.20",
    "babel==2.9.1",  # newer version fails because of language variants https://github.com/python-babel/babel/issues/454
    "django-money>=3.6",
    "django-autocomplete-light>=4.0",
    "mrml==0.1.14",
    "djangoql>=0.19.1",
    "django-hijack>=3.7.3",
    # Production runtime (was requirements/production.txt)
    "gunicorn>=23.0",  # https://github.com/benoitc/gunicorn
    "psycopg2>=2.9.10",  # https://github.com/psycopg/psycopg2
    "sentry-sdk>=2.0",  # https://github.com/getsentry/sentry-python
]

[dependency-groups]
dev = [
    "Werkzeug[watchdog]>=3.0",  # https://github.com/pallets/werkzeug
    "ipdb==0.13.9",  # https://github.com/gotcha/ipdb
    "psycopg2-binary>=2.9.10",  # https://github.com/psycopg/psycopg2
    "fab-classic==1.21.0",  # a fork of https://github.com/fabric/fabric
    # Testing
    "mypy>=1.13,<1.16",  # https://github.com/python/mypy  # pinned to django-stubs compatible-mypy range
    "django-stubs>=5.2",  # https://github.com/typeddjango/django-stubs
    "pytest>=8.0",  # https://github.com/pytest-dev/pytest
    "pytest-sugar>=1.0",  # https://github.com/Frozenball/pytest-sugar
    # Documentation
    "sphinx>=7.2",  # https://github.com/sphinx-doc/sphinx
    "sphinx-autobuild>=2024.2",  # https://github.com/GaretJax/sphinx-autobuild
    # Code quality (Astral ruff replaces black + flake8 + isort + autoflake)
    "ruff>=0.6",  # https://github.com/astral-sh/ruff
    "coverage>=7.4",  # https://github.com/nedbat/coveragepy
    # Django
    "factory-boy>=3.3.3",  # https://github.com/FactoryBoy/factory_boy
    "django-debug-toolbar>=5.2",  # https://github.com/jazzband/django-debug-toolbar
    "django-extensions>=4.0",  # https://github.com/django-extensions/django-extensions
    "django-coverage-plugin>=3.1",  # https://github.com/nedbat/django_coverage_plugin
    "pytest-django>=4.11",  # https://github.com/pytest-dev/pytest-django
]

[tool.ruff]
target-version = "py312"
line-length = 88  # matches the previous black default
extend-exclude = ["*/migrations/*", "docs", "node_modules", "*/static/CACHE/*"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes (incl. unused-import removal, replacing autoflake), I: isort
select = ["E", "W", "F", "I"]
ignore = ["E501"]  # long lines are mostly unsplittable strings; the formatter handles wrapping

[tool.ruff.lint.isort]
known-first-party = ["bakeup", "config"]
