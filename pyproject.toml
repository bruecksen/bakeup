[project]
name = "bakeup"
version = "0.1.0"
description = "Best baking app ever!"
requires-python = "==3.9.*"
dependencies = [
    "pytz==2024.1",  # https://github.com/stub42/pytz
    "python-slugify==6.1.1",  # https://github.com/un33k/python-slugify
    "Pillow==10.2.0",  # https://github.com/python-pillow/Pillow
    "argon2-cffi==23.1.0",  # https://github.com/hynek/argon2_cffi
    "whitenoise==6.6.0",  # https://github.com/evansd/whitenoise
    # Django
    "django==4.2.30",  # pyup: < 5.0  # https://www.djangoproject.com/
    "django-environ==0.11.2",  # https://github.com/joke2k/django-environ
    "django-model-utils==4.4.0",  # https://github.com/jazzband/django-model-utils
    "django-allauth==0.61.1",  # https://github.com/pennersr/django-allauth
    "django-crispy-forms==2.1",  # https://github.com/django-crispy-forms/django-crispy-forms
    "crispy-bootstrap5==2024.2",  # https://github.com/django-crispy-forms/crispy-bootstrap5
    "django-tables2==2.7.0",
    "django-treebeard==4.7.1",
    "sorl-thumbnail==12.10.0",
    "django_bootstrap5==23.4",
    "django_filter==23.5",
    "django-tenants==3.6.1",
    "qrcode==7.4.2",
    "django-taggit==6.1.0",
    "django-persistent-filters==1.0",
    "django-htmx==1.17.3",
    "wagtail==6.3.*",
    "tablib==3.5.0",
    "wagtailmenus==4.0",
    "wagtail-non-admin-draftail==0.18.2",
    "babel==2.9.1",  # newer version fails because of language variants https://github.com/python-babel/babel/issues/454
    "django-money==3.4.1",
    "django-autocomplete-light==3.11.0",
    "mjml-python==1.3.3",
    "mrml==0.1.14",
    "djangoql==0.18.1",
    "django-hijack==3.7.0",
    # Production runtime (was requirements/production.txt)
    "gunicorn==20.1.0",  # https://github.com/benoitc/gunicorn
    "psycopg2==2.9.3",  # https://github.com/psycopg/psycopg2
    "sentry-sdk==1.5.6",  # https://github.com/getsentry/sentry-python
    "django-anymail==8.5",  # https://github.com/anymail/django-anymail
]

[dependency-groups]
dev = [
    "Werkzeug[watchdog]==2.0.3",  # https://github.com/pallets/werkzeug
    "ipdb==0.13.9",  # https://github.com/gotcha/ipdb
    "psycopg2-binary==2.9.3",  # https://github.com/psycopg/psycopg2
    "fab-classic==1.21.0",  # a fork of https://github.com/fabric/fabric
    # Testing
    "mypy==0.931",  # https://github.com/python/mypy
    "django-stubs==1.9.0",  # https://github.com/typeddjango/django-stubs
    "pytest==7.0.1",  # https://github.com/pytest-dev/pytest
    "pytest-sugar==0.9.4",  # https://github.com/Frozenball/pytest-sugar
    # Documentation
    "sphinx==4.4.0",  # https://github.com/sphinx-doc/sphinx
    "sphinx-autobuild==2021.3.14",  # https://github.com/GaretJax/sphinx-autobuild
    # Code quality
    "flake8==4.0.1",  # https://github.com/PyCQA/flake8
    "flake8-isort==4.1.1",  # https://github.com/gforcada/flake8-isort
    "coverage==6.3.2",  # https://github.com/nedbat/coveragepy
    "black==23.9.1",  # https://github.com/psf/black
    "pylint-django==2.5.2",  # https://github.com/PyCQA/pylint-django
    "pre-commit==2.17.0",  # https://github.com/pre-commit/pre-commit
    # Django
    "factory-boy==3.2.1",  # https://github.com/FactoryBoy/factory_boy
    "django-debug-toolbar==3.2.4",  # https://github.com/jazzband/django-debug-toolbar
    "django-extensions==3.1.5",  # https://github.com/django-extensions/django-extensions
    "django-coverage-plugin==2.0.2",  # https://github.com/nedbat/django_coverage_plugin
    "pytest-django==4.5.2",  # https://github.com/pytest-dev/pytest-django
]
